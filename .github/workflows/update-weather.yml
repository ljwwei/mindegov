name: Update weather data

on:
  schedule:
    # 避開整點/整十分的高峰時段，GitHub 對這些時間點常延遲或略過；
    # 每 10 分鐘一次，即使部分排程被丟棄，仍有其他時段補上
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-weather.mjs'
      - '.github/workflows/update-weather.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch CWA temperature and MOENV AQI
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: node scripts/fetch-weather.mjs
      - name: Commit if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update weather data"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
