name: Update weather data

# 由 Cloudflare Workers 每 10 分鐘發送 workflow_dispatch 精準喚醒；
# 每次執行只跑單次 fetch，有變動才 commit，不再需要 24 小時常駐迴圈或自我接力。
# GitHub 內建排程僅保留作為離線備援。

on:
  schedule:
    # 離線備援：若外部排程異常，每 20 分鐘檢查一次
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-weather.mjs'
      - '.github/workflows/update-weather.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同時只跑一個，排隊中只保留最新一個
concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and commit weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"

          node scripts/fetch-weather.mjs || echo "fetch failed"

          git add data/weather.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update weather data"
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
          fi
          exit 0
